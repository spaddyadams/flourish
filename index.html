<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Take Root & Flourish — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --moss-deep: #2f4a2a;
      --moss: #4a6741;
      --sage-light: #c9d6c4;
      --sage-mid: #a8bfa3;
      --cream: #f7f3ec;
      --cream-warm: #ede5d6;
      --terracotta: #c97b5e;
      --terracotta-light: #e8b09a;
    }

    body {
      background-color: var(--moss-deep);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 70% 50% at 10% 90%, rgba(201,123,94,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 90% 10%, rgba(201,214,196,0.08) 0%, transparent 55%);
      pointer-events: none;
    }

    .ring {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      border: 1px solid rgba(201,214,196,0.08);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .ring:nth-child(2) { width: 700px; height: 700px; border-color: rgba(201,214,196,0.05); }
    .ring:nth-child(3) { width: 900px; height: 900px; border-color: rgba(201,214,196,0.03); }

    .container {
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeUp 1s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .coming-soon {
      font-family: 'DM Sans', sans-serif;
      font-size: clamp(1rem, 3vw, 1.4rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--terracotta-light);
      margin-bottom: 2.5rem;
      animation: fadeUp 1s 0.05s ease both;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .coming-soon::before,
    .coming-soon::after {
      content: '';
      width: 40px;
      height: 1px;
      background: rgba(201,123,94,0.4);
    }

    /* Tagline — same size as headline, upright (no italic) */
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.6rem, 7vw, 4rem);
      font-weight: 300;
      font-style: normal;
      line-height: 1.2;
      color: var(--sage-light);
      margin-bottom: 1rem;
      animation: fadeUp 1s 0.15s ease both;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.95rem, 5.3vw, 3rem);
      font-weight: 600;
      line-height: 1.12;
      color: var(--cream);
      margin-bottom: 2rem;
      animation: fadeUp 1s 0.25s ease both;
    }

    h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--terracotta-light);
    }

    .rule {
      width: 40px;
      height: 2px;
      background: var(--terracotta);
      margin: 0 auto 2rem;
      opacity: 0.7;
      animation: fadeUp 1s 0.3s ease both;
    }

    /* Amendment 4 — updated sub copy */
    p {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--sage-light);
      margin-bottom: 3rem;
      animation: fadeUp 1s 0.35s ease both;
    }

    p strong {
      color: var(--cream);
      font-weight: 500;
    }

    /* Amendment 3 — meta info as plain text, not pill buttons */
    .meta {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 1s 0.45s ease both;
    }

    .meta-item {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(201,214,196,0.45);
    }

    .meta-item + .meta-item::before {
      content: '·';
      margin-right: 1.5rem;
      color: rgba(201,214,196,0.2);
    }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>

  <div class="container">
    <p class="coming-soon">Coming Soon</p>
    <p class="tagline">Built by creatives, for creatives</p>
    <h1>You know and love your craft.<br>But turning it into a business?<br><em>That's the messy part.</em></h1>
    <div class="rule"></div>
    <p>Designed for creative start-ups and solo entrepreneurs.</p>
  </div>
</body>
</html>
